[project]
name = "backend"
version = "0.1.0"
description = "FSP Hackathon Backend Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy>=2.0.35",
    "greenlet>=3.0.0",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "redis>=5.0.8",
    "httpx>=0.27.2",
    "pypdf>=4.3.1",
    "reportlab>=4.2.2",
    "email-validator>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
]
