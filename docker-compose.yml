services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fsp_career}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg://fsp:fsp_secret@db:5432/fsp_career
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ML_SERVICE_URL: http://ml-service:8001
      FSP_MOCK_MODE: "true"
    ports:
      - "8000:8000"

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    # Локальный Qwen 14B крутится у сокомандника (Ollama/vLLM).
    # В compose — только API-обертка; веса не коммитим.
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
    ports:
      - "8001:8001"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:80"

volumes:
  pgdata:
